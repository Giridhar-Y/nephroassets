# OPTIONAL reverse-proxy template — the app container already serves the API and the
# built client from one Fastify process on one port (see Dockerfile/docker-compose.yml),
# so nothing here is required for the app to work. Use this only if your organization's
# own convention puts an Nginx tier in front of every container service (TLS
# termination, gzip, security headers, a familiar place to add rate limiting/WAF rules
# later) rather than terminating TLS at a cloud load balancer directly.
#
# To wire this in: run Nginx as its own container (official `nginx:alpine` image),
# mount this file to /etc/nginx/conf.d/default.conf, and point it at the `app` service
# on Docker's internal network (`http://app:3000` — the compose service name resolves
# via Docker's own DNS, no IP/port-mapping needed between the two containers). Example
# addition to docker-compose.yml:
#
#   nginx:
#     image: nginx:alpine
#     restart: unless-stopped
#     ports:
#       - "80:80"
#       - "443:443"
#     volumes:
#       - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
#       # - ./certs:/etc/nginx/certs:ro   # if terminating TLS here instead of upstream
#     depends_on:
#       - app
#
# TLS itself isn't configured below — either terminate it upstream of this (a cloud load
# balancer/ALB in front) and let this stay plain HTTP on the internal network, or add
# your own `listen 443 ssl;` + certificate directives if this IS your TLS termination
# point. The app's session cookie is marked `secure` in production either way, so
# whichever layer terminates TLS, it must actually be TLS by the time a request reaches
# a real browser.

upstream nephroassets_app {
    server app:3000;
}

server {
    listen 80;
    server_name _;

    # Security headers — a reasonable default set for an internal business app behind
    # your own network perimeter. Loosen/tighten to match your org's actual policy.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
        application/xml text/xml image/svg+xml;

    client_max_body_size 20m; # matches the app's own multipart limit (server/src/app.ts)

    # Standard WebSocket-upgrade proxy headers — this app doesn't use WebSockets today,
    # but every request (API and the SPA's own asset requests) goes through this one
    # location block, so these are included as harmless, standard reverse-proxy
    # boilerplate in case that ever changes.
    location / {
        proxy_pass http://nephroassets_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }

    location /api/health {
        access_log off;
        proxy_pass http://nephroassets_app;
    }
}
