# Keeps Dashboard's report_totals_cache warm on the Vercel deployment — see
# server/src/scripts/prewarmDashboard.ts's own header comment for why this has to run
# OUTSIDE Vercel entirely (verified: even an isolated dashboard-totals call already
# hits Vercel's own function timeout on real production data, so a Vercel Cron job
# would fail the exact same way). A GitHub Actions runner has no comparable time
# limit for a job this short, so it's a natural fit for a trigger that just needs to
# run occasionally with no execution-time pressure.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL — the same Supabase database the Vercel deployment uses.
#   JWT_SECRET   — any value works (this script never signs/verifies a real session,
#                  but it's transitively required at import time — see
#                  prewarmDashboard.ts's own comment). Reusing the real deployment's
#                  value is fine, a throwaway one works equally well.
# This workflow does nothing useful without both set — a missing one fails the run
# loudly (visible in the Actions tab), not a silent no-op.
#
# Configured for every 10 minutes, matching the Docker deployment's in-process
# scheduler — but GitHub's own `schedule:` trigger does NOT actually honor that on
# this account/plan. Measured directly (2026-09-23 incident): real gaps between
# scheduled runs of 2.5-4.5 hours, not 10 minutes — confirmed via `gh run list`
# showing this workflow's own run history, not just GitHub's general "may be delayed"
# disclaimer. This is why db/reportTotalsCache.ts's TTL is 6 hours, not the original
# 15 minutes: at 15 minutes, the cache reliably expired between real runs of THIS
# schedule, so the next live request paid the full cold-compute cost anyway — which
# then cascaded into pool.ts's connection limit saturating and degrading every other
# route, not just Dashboard. The cron expression is left at */10 (harmless — GitHub
# just runs it whenever it actually gets around to it) while a genuinely reliable
# trigger (an external cron service calling this workflow's dispatch API, or
# Supabase's own pg_cron) is still being evaluated, not yet decided.
#
# concurrency below: measured live against real production (219,329+ assets) — a
# fully-cold run (every date/endpoint combination missing at once) took 6m16s, well
# over half the 10-minute schedule interval. Without a guard, a slow run could still
# be going when the next scheduled tick fires, and two instances hitting the same
# Supabase compute concurrently is exactly the kind of contention this whole feature
# exists to avoid (see reports.ts's own history of that exact problem). Same goal as
# server/src/index.ts's in-process `prewarmRunning` guard, closest GitHub-native
# equivalent: `cancel-in-progress: false` queues a same-group run instead of starting
# it in parallel — the underlying job is idempotent and cheap to re-run (skips
# anything already cached), so queuing behind the current run is safe and simpler
# than the alternative (cancelling whichever one is older).
name: Dashboard cache pre-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: dashboard-prewarm
  cancel-in-progress: false

jobs:
  prewarm:
    runs-on: ubuntu-latest
    # 20, not 10: audit-reconciliation is warmed too now (2026-09-24), adding a third
    # full scan per cold date on top of the ~6 min totals+trend already measured.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: server
      - run: npx tsx src/scripts/prewarmDashboard.ts
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
