services:
  - type: web
    name: nephroassets
    runtime: node
    plan: free
    rootDir: .
    # `--include=dev`: Render sets NODE_ENV=production during the build too, which makes
    # plain `npm install` skip devDependencies (typescript, vite, @types/react, ...) —
    # both client and server need those present to build even though they run in prod.
    buildCommand: "cd client && npm install --include=dev && npm run build && cd ../server && npm install --include=dev && npm run build"
    startCommand: "cd server && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nephroassets-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.11.0
      - key: SEED_ON_BOOT
        value: "true"

databases:
  - name: nephroassets-db
    plan: free
    databaseName: nephroassets
    user: nephroassets
