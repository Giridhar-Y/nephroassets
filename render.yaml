services:
  - type: web
    name: nephroassets
    runtime: node
    plan: free
    rootDir: .
    buildCommand: "cd client && npm install && npm run build && cd ../server && npm install && npm run build"
    startCommand: "cd server && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nephroassets-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SEED_ON_BOOT
        value: "true"

databases:
  - name: nephroassets-db
    plan: free
    databaseName: nephroassets
    user: nephroassets
